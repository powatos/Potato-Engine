name: Cross-Platform Build Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install ncurses (linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y libncurses5-dev libncursesw5-dev

    - name: Install ncurses (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install ncurses

    - name: Install PDCurses (Windows)
      if: matrix.os == 'windows-latest'
      run: vcpkg install pdcurses:x64-windows

    # cmake
    - name: Configure CMake
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_PREFIX_PATH="C:/vcpkg/installed/x64-windows" \
            -DCURSES_NEED_NCURSES=TRUE \
            -DCURSES_LIBRARY="C:/vcpkg/installed/x64-windows/lib/pdcurses.lib" \
            -DCURSES_INCLUDE_PATH="C:/vcpkg/installed/x64-windows/include"
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
        fi
  
    - name: Build Engine
      run: cmake --build build